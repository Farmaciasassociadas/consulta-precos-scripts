# Parâmetros do motor de precificação.
# Nenhuma constante financeira ou fiscal deve viver no código — tudo aqui.
# Ver PLANO_SISTEMA_PRECIFICACAO.md para a origem de cada número.

[premissas]
cartao_pct = 0.0250
# Despesa FIXA (aluguel, folha, pró-labore, energia, sistema): custo do PERÍODO.
# Entra no ALVO (divisor_piso) — o preço praticado no mix tem de pagar a
# estrutura — mas NÃO no piso mínimo de venda, porque não desaparece se a
# unidade não vender.
#
# CALIBRADO EM 12/08/2026 COM NÚMERO REAL DO USUÁRIO, não estimativa:
#   estrutura fixa mensal = R$ 35.000 (salários, pró-labore, energia, água,
#   internet, sistema e tudo mais que não varia com a venda)
#   faturamento de regime adotado = R$ 150.000/mês
#   35.000 / 150.000 = 23,3%
#
# Por que R$ 150 mil e não os R$ 60-100 mil esperados nos primeiros meses:
# preço não conserta faturamento insuficiente. Ratear R$ 35 mil sobre R$ 60 mil
# daria 58,3% e um alvo econômico de 5,2x o custo — preço que ninguém paga, que
# reduziria ainda mais o volume e aprofundaria o buraco. O rateio no preço tem
# de refletir o regime que a loja planeja operar; o desencontro da rampa é
# financiado por capital, que é para isso que ele existe.
#
# Por que R$ 150 mil e não os R$ 450 mil do ponto maduro: assumir o ponto maduro
# hoje (7,8%) seria comprar volume com capital sem ter decidido comprá-lo.
#
# Sensibilidade medida no catálogo (1.679 itens, alvo econômico mediano/custo):
#     R$  60k/mês -> 58,3%  ->  5,23x     R$ 200k/mês -> 17,5%  ->  1,67x
#     R$ 100k/mês -> 35,0%  ->  2,36x     R$ 300k/mês -> 11,7%  ->  1,52x
#     R$ 150k/mês -> 23,3%  ->  1,85x     R$ 450k/mês ->  7,8%  ->  1,44x
#
# REVISAR quando o faturamento realizado de 3 meses seguidos passar de R$ 150
# mil ou quando a estrutura fixa mudar. O piso NÃO usa este número, então
# alterá-lo mexe só no alvo — e o alvo só manda em item sem concorrência
# visível ou em PROTECAO_MARGEM; item com ranking local segue o mercado.
despesas_fixas_pct = 0.2333
# Despesa VARIÁVEL por unidade vendida (sacola, cupom, perda/quebra atribuível
# à venda). Só esta entra no piso, junto com cartão e Simples.
# Estimativa inicial — recalibrar com DRE real após alguns meses de operação.
despesas_variaveis_pct = 0.0150
contribuicao_minima_reais = 0.60   # piso de contribuicao por unidade (item 3.3.1 do plano)

# --- Fase 5: PBM e Reforma Tributária -------------------------------------
# Ambos entram como despesa de comercialização (ver economico.despesas_de_
# comercializacao) e ambos estão ZERADOS de propósito.
#
# pbm_taxa_pct: a autorizadora de PBM cobra taxa de serviço sobre a venda
#   subsidiada (a ordem de grandeza citada na literatura do setor é ~4%).
#   Incide SÓ no item vendido pelo programa, por isso é argumento da função e
#   não constante. Preencher com a taxa do contrato assinado, não com a média
#   de mercado -- e marcar quais EANs entram no programa antes de ligar.
# cbs_ibs_pct: a fase de alíquotas-teste de 2026 (CBS 0,9% + IBS 0,1%) tem
#   tratamento próprio para empresa do Simples Nacional, que recolhe pelo DAS.
#   Preencher SOMENTE com confirmação escrita da contabilidade sobre haver
#   incidência efetiva além do DAS. Um número inventado aqui desloca o alvo dos
#   3.041 itens de uma vez -- parâmetro errado é pior que parâmetro ausente.
pbm_taxa_pct = 0.0
cbs_ibs_pct = 0.0

# Lucro líquido que o MIX inteiro deve entregar (não o alvo por item, que varia
# de propósito). Alimenta economico.margem_bruta_meta_mix -- ver [mix].
lucro_liquido_meta_mix_pct = 0.08
# Piso adicional de margem bruta minima sobre o custo.
# Ex: 0.25 = o preco nunca fica abaixo de custo / (1 - 0.25) = custo / 0.75.
# Para custo de R$ 35,35 -> piso de R$ 47,13.
# Zere para desabilitar (0.0). Valor global, usado onde nao houver regra por
# natureza fiscal abaixo.
margem_bruta_minima_pct = 0.25

[premissas.margem_bruta_minima_por_natureza]
# Afrouxa o piso de margem onde o mercado e' apertado, sem baixar o piso do
# catalogo inteiro. O valor global (0,25) e' um piso CEGO -- ignora custo,
# categoria e concorrencia -- e em 2026-08-10 respondia por boa parte dos 135
# itens em MERCADO_LOCAL_ABAIXO_DO_PISO e dos 16,3% precificados acima do
# maior concorrente local.
#
# medicamento: mercado mais transparente e comparavel (cliente compara preco de
#   remedio; PMC e' publico), com concorrencia direta de rede. 20% e' o que o
#   mercado local sustenta -- acima disso o item simplesmente nao vende.
# perfumaria_higiene / padrao: menos comparavel, cliente compara menos,
#   suporta a margem cheia.
#
# A contribuicao minima em reais e o divisor de contribuicao continuam valendo
# por baixo: afrouxar aqui nunca deixa o item sair com contribuicao negativa.
medicamento = 0.20
perfumaria_higiene = 0.25
padrao = 0.25

[piso_competitivo]
# Decisao de negocio 2026-08-07: NAO vender abaixo de quem esta do lado sem
# motivo comercial. Medido nesta data: 197 itens ficavam abaixo do MENOR
# concorrente local (gap mediano 4,8%, p90 36,4%) sem serem chamariz -- causados
# por Brick desatualizado e por sites REMOTOS (que nao existem na cidade)
# puxando o alvo para baixo. Descontar abaixo do que nenhum concorrente da
# regiao cobre nao compra cliente: so joga margem fora.
#
# So se aplica com vizinhanca confiavel (>= mercado.vizinhanca.n_min_local
# concorrentes LOCAIS distintos). Chamariz/KVI fica isento de proposito: ali
# ficar abaixo do menor concorrente e a decisao comercial deliberada.
ativo = true
# Encostar no menor concorrente local, sem ficar abaixo dele. 0.0 = empata.
desconto_tolerado_pct = 0.0
# SANIDADE DA ÂNCORA: um "menor concorrente" a uma ordem de grandeza do custo
# não é concorrente, é erro de EAN/apresentação no site dele.
#
# Medido em 12/08/2026, logo depois de baixar a barra da âncora para 1-2 lojas
# ([mercado.ancora_competitiva].n_min_lojas): o TRIDENT MENTA C/5 (custo
# R$ 1,81) tinha um único "local" a R$ 28,81 -- preço de display -- e o piso
# competitivo levou a sugestão de R$ 3,99 para R$ 51,49. Com 3+ lojas a
# winsorização e a camada 4b já filtravam esse tipo de erro; com 1-2 não há
# nada por baixo, então a guarda tem de estar aqui.
#
# 6,0x reusa o `markup_max` já calibrado em [mercado.brick_incoerente]: o
# markup real (mediana_web/custo) tem p99 de 4,46x em 2.127 EANs.
markup_max_ancora = 6.0
# Segunda guarda: teto do piso competitivo relativo à referência CONSOLIDADA
# (que já combina PMPF, Brick e todos os sites). O menor de 1-2 observações é
# amostra fina -- não se sobe 40% acima do mercado inteiro porque a única loja
# local que a coleta enxergou naquele dia estava cara. Sem isto (medido em
# 12/08/2026): TRAMADOL 50mg C/10 saía a R$ 39,99 contra referência de R$ 27,87.
banda_maxima_sobre_referencia = 0.25

[balcao]
# Preço MÁXIMO e MÍNIMO que o vendedor pode praticar no balcão.
#
# Três degraus NOMEADOS, não um intervalo contínuo: intervalo faz o vendedor ir
# direto ao mínimo. A concessão é decrescente (5%, depois o resto) para sinalizar
# que o limite chegou -- concessão de tamanho constante convida a mais uma rodada.
#
#   vitrine  = preço cheio (etiqueta/sistema/anúncio)
#   cortesia = -5%, para o cliente que hesita ou leva 2+ itens
#   cobrimos = encosta no menor concorrente local; SÓ quando o cliente cita um
#              preço concreto (desconto reativo salva venda; preventivo só
#              queima margem). Nunca abaixo do piso de contribuição.
#
# Todo desconto cai numa terminação da grade: R$ 22,90 lê como preço,
# R$ 22,71 lê como cálculo -- e cálculo convida a negociar de novo.
ativo = true
desconto_cortesia_pct = 0.05
desconto_maximo_pct = 0.15   # teto do desconto total, mesmo que o piso permita mais

# Âncora "de R$ X por R$ Y" usando o PMC/CMED. Só aparece quando o desconto fica
# numa faixa CRÍVEL. Medido em 2026-08-07: o desconto implícito do preço sugerido
# contra o PMC tem mediana de 41,9% e passa de 30% em 67% dos itens -- anunciar
# "50% de desconto" destrói a credibilidade em vez de construí-la, porque o
# mercado inteiro pratica ~47% abaixo do PMC (menor local / PMC = 0,53) e o
# cliente que já comprou o item sabe disso.
# Fora da faixa, a âncora certa é o concorrente ("na X está R$ 32, aqui R$ 27"),
# que é verificável. PMC só cobre 16,3% do catálogo (0% em perfumaria/varejo).
ancora_pmc_desconto_min = 0.08
ancora_pmc_desconto_max = 0.30

[simples.aliquota_nominal]
# Alíquota nominal da faixa atual do Anexo I (RBT12 ~R$395 mil -> faixa 3).
# Revisar quando o faturamento acumulado mudar de faixa.
faixa_pct = 0.0950
parcela_deduzir_reais = 13860.00
rbt12_referencia_reais = 395000.00

[simples.partilha_anexo1]
# Partilha das faixas 1a-5a do Anexo I (COAF / Contabilizei, ver plano Parte 2.1)
icms_pct = 0.3400
cofins_pct = 0.1274
pis_pct = 0.0276

[simples.segregacao.multiplicador]
# Multiplicador aplicado à alíquota efetiva nominal, por natureza fiscal do item.
# medicamento: ICMS-ST + monofásico PIS/COFINS -> remove ambas as parcelas.
# perfumaria_higiene: só monofásico -> remove só PIS/COFINS.
# padrao: nenhuma segregação.
medicamento = 0.505         # 1 - (icms_pct + cofins_pct + pis_pct)
perfumaria_higiene = 0.845  # 1 - (cofins_pct + pis_pct)
padrao = 1.000

[mercado.peso_brick]
# Peso do Brick (w_b) na mediana ponderada, por qualidade da evidência web.
#
# Quando HÁ vizinhança local confiável (>= mercado.vizinhanca.n_min_local lojas
# distintas), `com_vizinhanca_local` vence todas as faixas abaixo. Motivo: o
# Brick é auditoria de preço médio NACIONAL — dilui redes de desconto e regiões
# mais baratas — e vale pouco perto de concorrentes reais da mesma cidade,
# medidos hoje. Medido em 2026-08-07: o Brick causava 56% dos 176 itens
# precificados abaixo do menor concorrente local.
# Sem vizinhança local valem as faixas por qualidade da evidência web: ali o
# Brick é a melhor evidência que existe, e rebaixá-lo deixaria o item sem
# âncora nenhuma.
com_vizinhanca_local = 0.15
sem_brick = 0.00
sem_web = 1.00
web_n_ate_2 = 0.70
web_n_3_a_4 = 0.45
web_n_5_mais_cv_baixo = 0.30   # CV <= cv_baixo_limite
web_n_5_mais_cv_alto = 0.50    # CV > cv_alto_limite
cv_baixo_limite = 0.15
cv_alto_limite = 0.25

[mercado.brick]
spread_etiqueta = 0.03   # etiqueta física estimada = VUM_brick * (1 + spread)
divergencia_brick_web_limite = 0.25   # |web/brick - 1| acima disso -> REVISAO

[mercado.brick_incoerente]
# Descarta o Brick INTEIRO quando ele é erro de unidade (preço de caixa/display
# lido como unidade avulsa). Decisão de negócio 2026-08-11: quando o custo e os
# concorrentes concordam entre si -- os dois fazem sentido -- e o Brick está a
# uma ordem de grandeza dos dois, o errado é o Brick.
#
# Não confundir com [mercado.brick].divergencia_brick_web_limite (25%), que só
# LEVANTA A BANDEIRA e continua usando o Brick no blend. Medido em 2026-08-11:
# os 5 casos absurdos saíam com status DIVERGENCIA_BRICK_WEB e mesmo assim com
# preço sugerido tirado do Brick (DORALGINA C/4: custo 3,05, concorrentes 5,45,
# Brick 110,85 -> R$ 112,99; RESSALIV: custo 0,46, web 1,99 -> R$ 66,49).
#
# Calibração (2026-08-11, 1.256 EANs com custo + Brick + web):
#   razao_min  -- Brick/mediana_web fica em [0,5; 2,0] em 1.241 EANs e em
#                 [0,33; 0,5] em 10; salta direto para 20-40x em 5. Não existe
#                 NADA entre 2x e 20x, então 3x separa os dois grupos com folga
#                 larga dos dois lados (simétrico: pega erro nas duas direções).
#   markup_max -- mediana_web/custo tem p50 1,65x, p95 2,88x e p99 4,46x
#                 (n=2.127). 6,0x fica acima do p99; só 7 itens ficam de fora.
#                 RECALIBRADO em 30/08/2026 (`auditar_calibracao.py --secao
#                 sanidade`, n=2.835, base de 22 farmácias): p50 1,58x, p90
#                 2,49x, p95 2,87x, p99 4,15x -- o p99 CAIU com mais dado
#                 (menos itens no extremo, base mais estável). 6,0x continua
#                 folgado acima do novo p99; sem necessidade de ajuste.
#   n_min_web  -- exige o segundo testemunho. Sem NENHUMA web o Brick continua
#                 sendo a única âncora e a regra não se aplica.
#                 Era 2 até 12/08/2026, quando o LACTA BOMBOM OURO BRANCO 20 GR
#                 (custo R$ 1,06, uma única web a R$ 2,99, Brick R$ 120,02 =
#                 preço de display) saiu sugerido a R$ 139,99. O "segundo
#                 testemunho" que a regra pede já existia: o CUSTO. A guarda
#                 exige, logo acima, que custo <= web <= 6x custo -- então com 1
#                 observação web coerente com o custo há duas fontes
#                 independentes contra o Brick, não uma. Medido na base inteira:
#                 só 4 EANs têm Brick >= 3x a web com menos de 2 observações, e
#                 nos 4 o Brick é preço de caixa (120 vs 2,99 / 108 vs 4,89 /
#                 34,65 vs 1,29 / 24,55 vs 1,99). Nenhum falso positivo.
ativo = true
razao_min = 3.0     # |Brick / mediana_web| fora de [1/3, 3] -> descarta o Brick
markup_max = 6.0    # web só é "coerente com o custo" se custo <= web <= 6x custo
n_min_web = 1       # mínimo de observações web para a regra valer (ver acima)

[mercado.fator_fisico]
# Razão Brick / mediana_web por segmento. NOME LEGADO -- este fator NÃO mede
# canal (site x balcão), mede FONTE DE DADO. Ver _fator_brick_para_web.
#
# Calibrado em 1.523 EANs (plano 1.1), RE-MEDIDO em 2026-08-10 (mesma base,
# mesmos valores: GEN 0,886; NMED 0,916; RX 0,938; SIM 0,821) e RECALIBRADO em
# 30/08/2026 com `auditar_calibracao.py --secao fator_fisico` sobre a base das
# 22 farmácias do MP2 (n = 504 GEN, 353 RX, 179 SIM, 1206 NMED -- 3 a 6x mais
# itens que a calibração anterior): GEN 0,862; RX 0,931; SIM 0,755; NMED 0,913.
# Todos os quatro CAÍRAM um pouco -- o Brick ficou relativamente mais barato
# frente à web local com mais farmácias medidas, mas a ordem entre segmentos
# (SIM mais distante, RX mais perto) se manteve. É a distância entre a
# auditoria NACIONAL do Brick e a mediana dos sites que esta loja coleta
# (redes grandes do sul/sudeste): o Brick dilui redes de desconto e regiões
# mais baratas do país, então fica abaixo da web.
#
# USO: o Brick é DIVIDIDO por este fator, subindo para a escala regional
# observada. NUNCA multiplicar a mediana web por ele -- isso empurra o preço
# para a escala nacional (mais barata) e baixa a referência do lado errado.
# Efeito canal vive só em [mercado.premio_balcao].
NMED = 0.913
GEN = 0.862
RX = 0.931
SIM = 0.755
default = 0.90

[mercado.premio_balcao]
# O balcão é mais caro que o site, não mais barato (confirmado por teste
# presencial do usuário). Único lugar do motor que trata efeito CANAL.
#
# Aplicado uma vez, sobre a referência já consolidada, e por NATUREZA --
# nunca por site e nunca antes das 4 camadas. Multiplicar cada observação
# antes dos filtros empilha com o fator_fisico (dois multiplicadores sobre o
# mesmo preço) e desloca a banda de âncora, que compara contra o Brick cru:
# o teto efetivo cai de 1,60x para 1,45x e passa a descartar preço alto real
# com mais facilidade que preço baixo.
#
# Calibração: Procon-SP 2025 mede o site 13,88% mais barato que o balcão em
# genérico e 3,73% em referência. Adotado o extremo BAIXO da faixa (3-6%) --
# loja em abertura, sem cliente fidelizado, competindo com o que o cliente vê
# no celular na calçada. Recalibrar com 3-6 meses de venda própria.
medicamento = 1.05
perfumaria_higiene = 1.04
padrao = 1.03

[mercado.ancora_competitiva]
# Quem pode servir de ÂNCORA para o piso competitivo (não confundir com quem
# entra no alvo -- isso é [mercado.vizinhanca]).
#
# excluir_sites: o site continua valendo para n, CV, ranking e validação; só
# não define sozinho o piso. A Nissei está aqui porque o teste presencial do
# usuário (2026-08-10) mostrou que o preço ONLINE dela diverge muito do preço
# de BALCÃO -- e a coleta só enxerga o site. Cobrir um preço online que a
# própria loja não pratica no balcão joga margem fora sem ganhar cliente.
# (O peso menor por distância já é tratado em [mercado.peso_geografico].)
#
# O problema dela é DISPERSÃO, não nível: medido em 2026-08-10 (preço da loja
# / mediana das outras, mesmo EAN), Nissei 1,011, Raia 1,016, São João 1,027,
# São Paulo 0,940 -- ela não é mais barata que as outras online, mas tem p25
# 0,866 e p75 1,145. Por isso a correção certa é EXCLUIR da âncora, nunca
# deslocar o nível dela por um fator: deslocamento inflaria os ~50% de casos
# em que ela está normal.
#
# gap_maximo_pct: winsorização. Se o menor local está mais que isso abaixo do
# 2º menor, é tratado como preço-isca e a âncora passa para o 2º. Protege
# contra promoção pontual de QUALQUER loja, sem hardcodar quem é confiável.
#
# n_min_lojas: barra de evidência PRÓPRIA, mais baixa que a do alvo
# ([mercado.vizinhanca].n_min_local = 3). Definir o alvo com uma loja só seria
# frouxo; "não ficar mais barato que a loja da esquina" precisa de UM preço
# local observado -- ele já prova que existe alguém ao lado vendendo por aquilo.
#
# Medido em 2026-08-12: dos 73 itens precificados abaixo de TODOS os
# concorrentes locais, 63 tinham alvo_so_local = false. O motor via 1 ou 2
# lojas depois das camadas de frescor/âncora, embora o dado bruto tivesse 3 ou
# 4 -- então o piso competitivo nunca recebia âncora e o alvo caía nos sites
# REMOTOS, que são mais baratos e não disputam este cliente. A mediana desses
# 73 estava só 0,9% abaixo do menor local (não era um rombo), mas o p75 chegava
# a 5,2% e o p90 a 6,8%, e a causa era falha de dado, não decisão comercial.
ativo = true
excluir_sites = ["nissei"]
gap_maximo_pct = 0.15
n_min_lojas = 1
# n_min_lojas_teto: barra MAIS ALTA para a ponta de cima, por estatística e não
# por gosto. O MÍNIMO de uma amostra é limite superior do mínimo verdadeiro --
# se vi uma loja a R$ 20, existe alguém ao lado vendendo por R$ 20 ou menos, e
# errar aqui erra na direção segura. O MÁXIMO de uma amostra pequena
# SUBESTIMA o máximo verdadeiro: com uma loja observada eu não sei quem é o
# mais caro da praça, sei só quem eu vi -- e usar isso como TETO transforma o
# único preço coletado, que pode estar em promoção, em trava dura.
#
# Medido em 12/08/2026: com a mesma barra (1 loja) nas duas pontas,
# PISO_ACIMA_DO_MERCADO saltou de 30 para 204 itens numa rodada.
n_min_lojas_teto = 3

[mercado.pmpf]
# TERCEIRA ÂNCORA: Preço Médio Ponderado ao Consumidor Final do Paraná
# (SEFAZ-PR, NPF 07/2026, vigente 01/04/2026 a 30/09/2026, 11.023 medicamentos).
#
# É a melhor fonte de preço que esta loja tem, e por três motivos que nenhuma
# outra reúne: é preço de BALCÃO (apurado em NFC-e emitidas ao consumidor
# final, não em vitrine de site), é ESTADUAL (Paraná, não a média nacional do
# Brick) e é OFICIAL e gratuito, por EAN.
#
# Validação em 12/08/2026 contra o catálogo:
#   cobertura de natureza=medicamento .... 527/553 = 95,3%
#   cobertura do catálogo inteiro ........ 1.021/3.041 = 33,6%
#   correlação de log-preço com a mediana local (539 EANs) ... 0,958
#   PMPF / mediana local ... p25 0,91 | mediana 0,98 | p75 1,07
#   PMPF / PMC ............. p25 0,48 | mediana 0,70 | p75 0,82 (coerente)
#
# A mediana de 0,98 é o achado que muda o desenho: o PMPF JÁ ESTÁ na escala do
# balcão local, sem fator de conversão -- ao contrário do Brick, que precisa de
# 0,78 a 0,94. Duas consequências implementadas:
#   1. ele tem prioridade sobre o Brick como âncora da camada 3;
#   2. o prêmio de balcão NÃO se aplica sobre a parcela dele (ver o cálculo em
#      calcular_mercado: o PMPF entra depois do prêmio, não antes).
#
# NOTA PARA REVISÃO: essa mesma medição sugere que [mercado.premio_balcao] de
# 1,05 pode estar alto -- mediana_local × 1,05 fica ~7% acima do PMPF. Não foi
# alterado aqui porque mexer no prêmio move o nível de preço do catálogo todo e
# o PMPF é média do estado inteiro (inclui cidades e canais mais baratos que
# Maringá centro). Decisão consciente do usuário, não ajuste automático.
#
# ATUALIZAR a cada semestre: a NPF nova sai em torno de 01/04 e 01/10.
#   https://www.fazenda.pr.gov.br/Pagina/Pauta-de-Medicamentos
ativo = true
arquivo = "pmpf_pr.csv"
prioridade_ancora = true
# Pesos no blend. O PMPF é melhor que o Brick e pior que o concorrente real
# medido hoje -- a tabela vale por SEMESTRE e é média do estado inteiro.
com_vizinhanca_local = 0.25    # há 3+ lojas locais: o vizinho de hoje manda
sem_vizinhanca_local = 0.45    # web fraca ou remota: o PMPF pesa mais
sem_web = 0.80                 # nenhuma observação: quase só ele

[mercado.marketplace]
# Decisao de negocio 2026-08-05: preco de vendedor terceiro dentro do site da
# farmacia (status "MARKETPLACE") deixa de ser descartado e passa a compor a
# mediana de referencia, com peso reduzido (menos confiavel que preco proprio
# do site) -- ver _peso_observacao/_mediana_ponderada em engine/mercado.py.
#
# ATENCAO (medido em 2026-08-10): com [mercado.peso_geografico] ATIVO, este peso
# NAO age no caminho principal. `_mediana_geografica` agrupa por site e tira
# `median()` simples dentro de cada um, sem consultar peso de observacao --
# entao o marketplace entra com peso pleno na mediana do site dele.
#
# O peso continua valendo nos fallbacks que usam `_mediana_ponderada`:
# peso_geografico inativo, menos de 3 sites distintos, ou o calculo
# pre-ancora da divergencia Brick/web. Ou seja: ele age em EAN com pouca
# concorrencia, e nao no EAN bem coberto.
#
# Mantido assim de proposito. Aplicar o peso dentro do site exigiria
# `_mediana_ponderada` por site, e com poucas observacoes por site ela vira um
# DEGRAU (ver o aviso em _mediana_ponderada): descontar uma observacao mudaria
# a mediana do site em ~60%, tornando o preco instavel a cada falha de coleta.
# Se um dia o marketplace precisar mesmo de desconto no caminho principal, a
# forma correta e' SELECIONAR quem entra (como ja se faz com vizinhanca e com
# a ancora competitiva), nao atribuir peso numerico aqui.
peso = 0.90

# Peso geografico por concorrente na media das medianas.
# Cada concorrente contribui com sua MEDIANA (um preco representativo),
# ponderada pelo peso geografico. Peso maior = mais proximo/relevante.
# Evita que sites distantes diluam a influencia de quem realmente disputa
# o cliente. So se aplica com vizinhanca local ativa (>= n_min_local).
# Sites nao listados recebem peso 1.0.
[mercado.peso_geografico]
ativo = true
drogaraia = 4.0     # mais proxima — mesmo quarteirao
farmasp = 3.5       # muito proxima (farmasp/saopaulo = mesma loja)
saopaulo = 3.5      # idem
saojoao = 2.0       # perto tambem, so um pouco menos que Raia/Sao Paulo (2026-08-10)
nissei = 1.0        # mais distante

[farmacia_popular]
# Esta loja nao e credenciada no programa, entao nao compete com o preco
# subsidiado de quem e. A lista (655 EANs, farmacia_popular.csv) SINALIZA esses
# itens na justificativa -- nao filtra preco.
#
# Por que nao filtrar (medido em 2026-08-06): se algum site praticasse preco
# subsidiado, ele apareceria sistematicamente abaixo NOS ITENS DA LISTA e normal
# fora dela. Nao acontece -- o desvio mediano por site nos 40 EANs da lista com
# concorrencia (-2,6% a +5,0%) e igual ao do grupo de controle. Os 6 precos bem
# abaixo da mediana estao espalhados por 6 sites diferentes, assinatura de
# promocao pontual, nao de credenciamento; e as camadas de ancora/MAD ja tratam
# esses casos. Descartar preco baixo sem essa evidencia seria auto-engano: o
# cliente que paga menos na concorrencia nao sabe se e subsidio, e o preco de
# referencia dele continua sendo aquele.
#
# Se um dia a coleta identificar QUAIS sites sao credenciados, a regra correta e
# retirar so esses do conjunto do ranking -- nunca descartar por preco baixo.
sinalizar = true

[classificacao]
# O eixo (GENERICO/ETICOS/SIMILAR) vindo do ERP tem sujeira conhecida: medido em
# 2026-08-06, dos 434 itens com segmento Brick E eixo cadastrado, 111 divergem
# (26%) -- quase todos brick=GEN vs ERP=ETICOS. Como a politica pede 10% de
# lucro-alvo para ETICOS > RX e 15% para GENERICO > RX, o item mal classificado
# e vendido com margem menor do que a propria politica manda.
#
# Isto NAO altera aliquota: natureza_fiscal decide por prefixo de medicamento +
# ICMS-ST, e os tres eixos sao medicamento (verificado em 2026-08-06).
corrigir_eixo_por_brick = true

# Resgata para o eixo medicamento um item cadastrado fora dele (PERFUMARIA,
# VAREJO, EXCLUSIVOS) quando o segmento Brick indica RX/GEN/SIM. Medido em
# 2026-08-10: 82 EANs tinham pmc_maximo preenchido (prova de medicamento CMED)
# fora do eixo medicamento; 5 geraram preco sugerido absurdo (ate R$ 553 num
# item de R$ 35 no mercado) por levar a margem-alvo de perfumaria em vez da de
# medicamento. So atua com segmento_brick preenchido (38 dos 82 casos); os
# outros 44 (so pmc_maximo, sem segmento) ficam de fora -- eixo desconhecido,
# nao da para corrigir com seguranca. Ver economico.resgatar_eixo_perdido.
resgatar_eixo_perdido = true

# MODO SOMBRA para o eixo inferido pelo NOME (marcador "GEN" na descricao),
# usado onde o Brick nao cobre (so 45% do catalogo tem segmento).
# Sombra = registra a discordancia na justificativa e NAO altera o preco.
#
# CRITERIO DE SAIDA (definido junto com a regra, para nao virar quarentena
# permanente como ja aconteceu com a coleta do Panvel): promover para correcao
# ativa quando, numa amostra de >= 50 itens sinalizados e conferidos a mao, a
# concordancia com o julgamento humano for >= 90%. Abaixo disso, ajustar a
# deteccao antes de promover. Conferir com:
#     python auditar_eixo_sombra.py
eixo_por_nome_modo_sombra = true

[mercado.vizinhanca]
# Decisao de negocio 2026-08-06: nem todo site coletado disputa o mesmo cliente.
# Farmacias São Paulo, São João e Droga Raia ficam perto da loja; a Nissei fica
# perto porem um pouco mais longe. As demais (Panvel, Pague Menos, Preço
# Popular, Drogaria São Paulo) NAO existem na cidade -- servem para VALIDAR o
# preco (detectar erro de EAN/apresentacao), nao para definir o alvo.
#
# Por isso a preferencia e resolvida SELECIONANDO quem entra no alvo, e nao com
# peso numerico por site: medido em 2026-08-06, a mediana ponderada com peso
# misto e um degrau (para [10,12,20,22] devolve 20 ou 12 conforme QUAL site foi
# descontado, nunca 16), o que tornaria o preco instavel a cada falha de coleta.
#
# Medicao que motivou a regra (2.068 EANs com observacao valida):
#   49% tem >= 3 locais; so 5% nao tem nenhum local.
#   Entre os que tem >=3 locais e algum remoto, a mediana local e MAIS CARA que
#   a geral em 63% dos casos (mediana +2,4%, p75 +8,8%).
ativo = true
# "saopaulo" e o nome ANTIGO de "farmasp" (Farmacias Sao Paulo), renomeado em
# 07/2026 -- ver config_app.py. O historico coletado antes disso ficou gravado
# com o nome velho: em 07/08/2026 eram 1.343 observacoes como "saopaulo" contra
# 569 como "farmasp". Sem os dois nomes aqui, o concorrente mais proximo entrava
# como remoto e 332 EANs (16%) ficavam no regime errado.
sites_locais = ["farmasp", "saopaulo", "saojoao", "drogaraia", "nissei"]
n_min_local = 3            # a partir daqui o alvo usa SO os locais (LOJAS distintas)
# Abaixo de n_min_local caimos no conjunto completo. Nesse caso a confianca cai,
# mas NAO rebaixamos para PROTECAO_MARGEM quando ha evidencia remota boa
# (n >= n_remoto_confiavel e cv <= cv_remoto_confiavel): senao um item de Curva A
# popular, que os locais ainda nao vendem, sairia do preco competitivo justo
# exatamente quando mais precisa dele.
n_remoto_confiavel = 4
cv_remoto_confiavel = 0.20

# De-para de nome antigo -> loja real, para nao contar a mesma loja duas vezes
# em n_min_local. Medido em 2026-08-07: farmasp x saopaulo tem correlacao de
# log-preco 0,995 (a mais alta da matriz) e preco identico ao centavo em 89,7%
# dos 553 EANs em que os dois aparecem -- e a mesma loja, renomeada em 07/2026.
# (Sub-tabela por ultimo: em TOML tudo que vier depois pertenceria a ela.)
[mercado.vizinhanca.apelidos_site]
saopaulo = "farmasp"

[mercado.outliers]
frescor_dias_max = 45
banda_ancora_min = 0.60
banda_ancora_max = 1.60
mad_n_min = 5
mad_multiplicador = 3.0

# Camada 4b: rede de segurança para n pequeno SEM âncora (sem Brick).
# Medido em 2026-08-10: 465 EANs têm 2-4 observações (MAD não roda, exige 5) e
# 315 deles não têm Brick (âncora também não roda) -- ficavam sem NENHUMA
# proteção contra outlier. Casos reais que passavam inteiros para a mediana:
#   [7,99  9,49  19,49  26,89]   spread 3,4x
#   [7,49  9,29  24,60]          spread 3,3x
# Descarta o ponto que estiver a mais de razao_max vezes (ou 1/razao_max) da
# mediana dos DEMAIS. Usa razão, não MAD: com n=3 o MAD é instável e derruba
# ponto bom. 2,5x é grosseiro de propósito -- pega erro de apresentação/
# embalagem (origem típica de spread 3x entre farmácias), não diferença
# comercial legítima. Nunca esvazia o conjunto.
razao_n_min = 3
razao_max = 2.5

[mercado.ewma]
# Item 4 do plano de melhorias estatisticas (2026-08-30). So' tem efeito onde
# ha HISTORICO real por (EAN, site) -- hoje so' o MP2 (observacao_farmacia
# guarda todos os ciclos; o precos.csv do app guarda so' a ultima linha por
# par, entao aqui fica so' documentado para as duas copias nao divergirem).
#
# Troca "ultima observacao" por uma media com decaimento por TEMPO (ver
# engine.mercado.suavizar_ewma_temporal) antes de entrar nas 4 camadas de
# outlier -- reduz o efeito de uma promocao pontual de UM dia sem esperar as
# camadas de outlier reagirem depois (elas comparam ENTRE sites no mesmo
# ciclo, nao a serie propria de um site ao longo do tempo).
#
# half_life_dias: quanto tempo para um preco antigo perder METADE do peso.
# Escolhido bem abaixo de outliers.frescor_dias_max (45): 7 dias absorve
# ruido de dia a dia e ainda reage dentro de uma semana a uma mudanca real de
# preco. Maior que isso deixaria promocao de 2 semanas atras pesando demais;
# menor que isso deixa de suavizar quase nada.
#
# DESLIGADO por decisao de negocio em 30/08/2026, apos dry-run comparativo
# contra a base real do MP2 (3.265 EANs): 17,6% do preco sugerido MUDA com
# isto ligado (mediana 0%, mas p90 +4,1%, p99 +22,2%, maximo +236%). Parte
# grande do efeito e' um GANHO real -- recupera preco valido de um site cuja
# ULTIMA tentativa de coleta falhou (TIMEOUT/NAO_ENCONTRADO), que a regra
# antiga ("so' a ultima observacao") descartava por inteiro mesmo havendo
# preco bom 1-2 dias antes -- mas a magnitude agregada e' grande demais para
# ligar sem revisao humana da amostra, mesmo com os testes automatizados
# verdes. Ativar so' apos conferir uma amostra dos itens que mais mudam
# (rodar `motor/calcular.py --dry-run` com isto ligado e comparar).
ativo = false
half_life_dias = 7.0

[mercado.hampel_temporal]
# Item 5 do mesmo plano. Roda ANTES do EWMA (filtra a serie, depois suaviza
# os sobreviventes) -- ver engine.mercado.hampel_por_serie_temporal. Sinal
# DISTINTO da camada 4 (outliers.mad_multiplicador): aquela compara sites
# ENTRE SI no mesmo ciclo; esta compara cada ponto contra a PROPRIA historia
# do site, pegando uma queda/alta abrupta mesmo quando nenhum outro site
# mudou naquele ciclo.
#
# n_min: minimo de observacoes de preco validas na serie para o teste rodar
# -- mesmo espirito do outliers.mad_n_min (historico curto e' ruido, nao
# evidencia). n_mad: multiplicador do MAD leave-one-out; mantido igual ao
# outliers.mad_multiplicador por nao haver ainda evidencia de que o eixo
# tempo pede um limiar diferente do eixo cross-site.
#
# DESLIGADO pelo mesmo motivo do [mercado.ewma] acima -- os dois foram
# medidos juntos no mesmo dry-run.
ativo = false
n_min = 5
n_mad = 3.0

[mercado.cluster_acima_brick]
# Quando concorrentes descartados pela ancora (por estarem acima de
# Brick x banda_ancora_max) formam um cluster apertado, confiamos nesse
# cluster em vez de colar no Brick puro -- o Brick pode estar desatualizado
# e vender abaixo do mercado real deixa margem na mesa (caso BUPROVIL 600mg
# C/20, 2026-08-04: Brick 13,93 vs. concorrentes reais 19,58-27,50).
#
# n_min_sob_pmpf: quando a âncora é o PMPF a barra sobe, porque devolver preço
# que uma fonte OFICIAL rejeitou exige mais evidência. Não é desligar (foi o que
# se fez em 12/08/2026 e custou o PROFENID 100mg INJ: PMPF R$ 7,65 contra oito
# lojas de R$ 30,92 a R$ 43,49, todas apagadas, sugestão R$ 7,79 = 20% do
# mercado). O PMPF é semestral: quando envelhece ou traz outra apresentação, sem
# cluster não sobra proteção nenhuma.
# Calibração: os dois casos reais separam-se pelo nº de LOJAS INDEPENDENTES --
# DORALGINA C/4 (devolução ruim) tinha 2, PROFENID tem 8. Erro de apresentação é
# de site; não se repete idêntico em três lojas. Medido na base: só 5 EANs têm
# 3+ lojas totalmente apagadas pela banda do PMPF, e nos 5 o mercado está certo.
n_min = 2          # minimo de concorrentes no cluster para confiar nele
n_min_sob_pmpf = 3 # ...e de LOJAS distintas, quando a ancora e o PMPF
cv_max = 0.20       # dispersao maxima (coeficiente de variacao) do cluster
peso_brick = 0.30   # peso do Brick no blend quando o cluster e adotado

[mix]
# Fase 3: controle de margem do MIX. Fecha o laço que faltava -- até aqui o
# motor otimizava item a item e a margem agregada era consequência, não meta.
#
# Se o conjunto fica abaixo da meta da DRE, o ajuste sai EXCLUSIVAMENTE dos
# itens sem vizinhança local visível. Subir preço onde o cliente compara é
# literalmente como se perde cliente; a cauda longa de baixa comparabilidade é
# quem pode absorver. É o subsídio cruzado na ordem certa: primeiro medir o
# buraco, depois escolher quem paga -- e não uma tabela de margem por categoria
# escrita a priori, como o relatório anexo sugere.
#
# Medido em 12/08/2026: os itens com 3+ lojas locais operam a 33,1% de margem
# bruta mediana e os sem vizinhança a 44,1%. O ajuste mexe só no segundo grupo.
#
# ajuste_maximo_pp: teto do que se admite corrigir no preço. Se o buraco for
# maior, ele APARECE no relatório em vez de ser espremido em silêncio -- aí a
# resposta é compra, mix ou estrutura, não etiqueta.
ativo = true
tolerancia_pp = 0.01
ajuste_maximo_pp = 0.05

[xyz]
# Fase 6: segundo eixo da matriz ABC-XYZ (previsibilidade da demanda).
#
# DESLIGADO até haver histórico. O CV de demanda com menos de 26 semanas é
# ruído, não previsibilidade -- e a loja ainda não completou o primeiro mês.
# Ligar quando `semanas_minimas` estiver satisfeito para uma fatia relevante do
# catálogo; até lá, premio_risco_xyz devolve 0,0 para tudo.
#
# A lógica do prêmio é de risco de INVENTÁRIO, não de sensibilidade a preço:
# item de alto valor e demanda errática (célula AZ) exige estoque de segurança
# grande e corre risco real de vencer na prateleira. Item AX gira sozinho.
ativo = false
semanas_minimas = 26
limite_x = 0.25
limite_y = 0.50

[xyz.premio]
# Acréscimo em pontos de lucro-alvo por célula. Só as células de risco real.
AZ = 0.04
BZ = 0.03
CZ = 0.02
AY = 0.01
BY = 0.01

[teto_competitivo]
# Simétrico de [piso_competitivo]: não ficar ACIMA de toda a praça quando há
# vizinhança confiável. Medido em 2026-08-12 sobre o catálogo (1.504 itens com
# custo e preço): 156 dos 999 com >= 3 lojas locais (15,6%) saíam mais caros que
# o MAIOR concorrente local, excesso mediano de +6,4% (p90 +14,5%) -- 87 deles
# de Curva A, justamente os de maior visibilidade.
#
# A origem NÃO era o piso: era o teto frouxo do tier PROTECAO_MARGEM
# (`min(alvo_econ, referencia * 1,15)`), que somado ao prêmio de balcão passava
# do concorrente mais caro da vizinhança. Margem que não vende não é margem.
#
# O piso vence sempre: quando ele não cabe abaixo do maior local, o preço fica
# onde está e o status honesto (PISO_ACIMA_DO_MERCADO / CUSTO_ACIMA_DO_MERCADO)
# continua sinalizando -- 65 itens na medição, todos casos reais de compra ruim
# ou de piso apertado, que se resolvem renegociando a compra, não no preço.
# Chamariz fica isento (já é precificado por baixo, de propósito).
#
# Custo medido de ligar isto sozinho: -0,83% de receita agregada.
ativo = true
folga_pct = 0.0   # 0 = empata com o mais caro da praça; 0.05 = tolera 5% acima

[grade]
terminacoes = [0.49, 0.79, 0.90, 0.95, 0.99]

[grade.limiar]
# Arredondamento por LIMIAR psicológico, no lugar de "a terminação mais próxima
# do alvo". Sobe o preço até a maior terminação que ainda fica abaixo da
# fronteira de dígito da esquerda -- e nunca ultrapassa um concorrente local.
#
# Base: o efeito de dígito da esquerda (Thomas & Morwitz, Journal of Consumer
# Research 2005) só dispara quando o dígito mais à esquerda muda. R$ 19,49 e
# R$ 19,99 são lidos como "dezenove e pouco"; R$ 20,49 vira "vinte". Os 50
# centavos entre 19,49 e 19,99 são margem que o cliente não percebe.
#
# Por que a trava competitiva é obrigatória: sem ela (medido em 2026-08-12),
# subir por limiar levava 148 itens a virar o mais caro da praça -- ganho de
# receita comprado com perda de cliente. Com a trava: ZERO.
#
# Medição no catálogo (2026-08-12, tolerância 3%):
#   sem trava: sobe 80% dos itens, +1,91% de receita, 78 viram os mais caros
#   com trava: sobe 64% dos itens, +1,37% de receita, 0 viram os mais caros
# Combinado com [teto_competitivo]: +0,77% de receita, +2,11% de LUCRO BRUTO,
# margem bruta agregada 36,58% -> 37,07%, e os itens acima de toda a praça caem
# de 156 para 65.
#
# ATENÇÃO: 37,9% dos preços do catálogo terminavam em ",49" -- a pior das cinco
# terminações do ponto de vista perceptual, e artefato de "escolher a mais
# próxima do alvo". É esse resíduo que esta regra recupera.
ativo = true
# Teto de quanto o preço pode subir acima do alvo econômico. 3% foi escolhido
# medindo 2%/3%/5%: a 5% o ganho sobe para +2,02% mas 49 itens perdem posição
# no ranking local; a 3% são 47, a 2% são 39, com +0,90%.
tolerancia_pct = 0.03
# [limite_de_preço, passo]. Abaixo de R$ 20 o cliente lê o real (fronteiras em
# 18, 19, 20...); até R$ 100 lê a dezena em múltiplos de 5 (45, 50, 55...);
# acima disso, a dezena (110, 120...). Acima do último limite vale passo 10.
degraus = [[20.0, 1.0], [100.0, 5.0]]

[ranking]
# Decisao de negocio 2026-08-05: a loja nao precisa ser a mais barata. Em vez
# de mediana_fisica * 0.99, posiciona o preco deliberadamente na N-esima
# posicao (mais barata) entre os concorrentes elegiveis, escolhendo o MAIOR
# preco que ainda garanta essa posicao. So se aplica com concorrentes
# suficientes (n_min_observacoes); abaixo disso, cai na regra antiga (*0.99).
n_min_observacoes = 3
[ranking.rank_alvo_por_tier]
PRECO_IMAGEM = 2   # itens de alta visibilidade: 2o menor preco
PADRAO = 2         # demais itens com mercado (sem Curva ABC conhecida): 2o menor preco

[ranking.rank_alvo_por_curva]
# Quando a Curva ABC (giro/faturamento) e conhecida, ela manda mais que o
# tier: Curva A fica mais perto do mercado (2o lugar, risco de evasao maior),
# Curva B/C protege mais margem (3o lugar, cliente compara menos).
A = 2
B = 3
C = 3

[chamariz]
# Exceção estratégica controlada: lista CURTA de itens chamariz/KVI, escolhida
# automaticamente (engine/chamariz.py). Nunca aplicada ao catálogo inteiro.
#
# MUDANÇA 12/08/2026 (decisão do usuário): de 32 itens (top 8 × 4 segmentos)
# para 7 no TOTAL, escolhidos pelos mais vendidos E mais lucrativos, sem cota
# por segmento.
#
# A evidência sustenta a lista curta. Hamilton & Chernev (Journal of Marketing,
# 2013) mostram que imagem de preço não é média de preço: o consumidor apoia a
# percepção da loja em POUCOS itens que conhece de cor -- a literatura de KVI
# fala em três a cinco. Trinta e dois itens não compram seis vezes mais
# percepção que cinco; compram a mesma percepção gastando seis vezes mais
# margem. E a cota por segmento era pior ainda: obrigava a rebaixar 8 itens de
# NMED (não-medicamento) mesmo quando nenhum deles era conhecido do bairro,
# só para preencher a cota.
#
# `peso_margem` é o que faz "lucrativo" entrar no critério: entre dois itens de
# giro parecido, o chamariz certo é o que ainda sobra margem depois do
# desconto. Chamariz de margem magra é desconto sobre desconto.
top_n_global = 7
n_concorrentes_minimo = 3
desconto_maximo_pct = 0.02   # ate 2% abaixo do menor concorrente elegivel -- nunca desconto livre
revisar_a_cada_dias = 90
# Pesos do score (somam 1,0): giro (posição no Brick), margem disponível,
# comparabilidade (nº de concorrentes) e dispersão (CV baixo = mais comparável).
peso_giro = 0.40
peso_margem = 0.30
peso_comparabilidade = 0.20
peso_dispersao = 0.10

[custo_estimado]
# Item sem custo validado por NF (ex.: herdado de compra de ponto de venda):
# estima um custo retroativo como fracao do preco de mercado, so para o
# painel nao ficar "sem margem calculavel". Nunca usado para bloquear o
# preco -- so para relatorio/monitoramento. Revisar quando houver NF real.
#
# Usado so' como FALLBACK GLOBAL: natureza fiscal com entrada em
# [custo_estimado.por_natureza] usa o `pct_shrunk` de la' (ver
# economico.pct_custo_estimado, item 6 do plano de melhorias estatisticas,
# 2026-08-30). Natureza desconhecida ou tabela vazia caem aqui.
pct_do_preco_mercado = 0.6302

[custo_estimado.por_natureza]
# Shrinkage bayesiano (peso = n/(n+100)) sobre o markup mediano
# custo/mercado medido por natureza -- ver `auditar_calibracao.py --secao
# shrinkage` para a conta e K_SHRINKAGE_NATUREZA para a forca do prior.
# Medido em 30/08/2026 sobre a base de 22 farmacias (n = EANs com custo E
# mercado validos na natureza): medicamento e' o mais barato relativo ao
# mercado (markup mais alto, mercado mais competitivo/transparente);
# perfumaria/padrao ficam mais perto do global porque tem mais massa (1651 e
# 732 EANs) e menos evidencia de vies proprio.
medicamento.n = 452
medicamento.pct_shrunk = 0.5532
perfumaria_higiene.n = 1651
perfumaria_higiene.pct_shrunk = 0.6439
padrao.n = 732
padrao.pct_shrunk = 0.6632

[trava.variacao_maxima_mercado_por_tier]
# Variação máxima do preço final vs. referência de mercado (Brick/web), por
# tier — não mais vs. preço praticado hoje (cadastro reconhecidamente
# desatualizado/incoerente, não serve como âncora de bom senso).
# Tiers mais sensíveis a imagem toleram menos divergência do mercado;
# tiers de proteção de margem toleram mais (podem ficar acima do mercado
# de propósito, para preservar contribuição).
PADRAO = 0.50
PROTECAO_MARGEM = 0.30
PRECO_IMAGEM = 0.60

[embalagem]
# Margem bruta suposta no preço do CONCORRENTE, usada só para deduzir o
# `fator_venda` provável quando a NF vem em pack e a venda é na unidade
# (ver economico.fator_venda_provavel). Não entra em nenhum preço.
#
# Calibrado em 12/08/2026 no único caso da base cuja embalagem está escrita no
# nome -- SAB PROTEX CREAM 85G **C/12**, custo de NF R$ 39,89 contra mercado de
# R$ 5,08 (razão crua 7,9). Com 0,35 a fórmula devolve exatamente 12; com 0,21
# devolvia 10. Um ponto de validação só, e é por isso que o resultado é
# SUGESTÃO na justificativa e nunca correção automática -- quem confirma é a NF.
margem_referencia_pct = 0.35
